name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  uxplay:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
      - name: Compilar o uxplay
        run: ./scripts/compilar-uxplay.sh
      - name: Conferir a versao
        run: ./uxplay/build/uxplay.exe -v | grep "UxPlay version 1.74"
      - name: Testes das correcoes no UxPlay
        run: ./scripts/testar-uxplay.sh
      - name: Montar o pacote
        run: ./scripts/montar-pacote.sh
      - name: Conferir que o pacote se basta
        shell: pwsh
        run: ./scripts/conferir-pacote.ps1 -Msys2 "${{ steps.msys2.outputs.msys2-location }}"
      - name: Licencas
        run: ./scripts/licencas.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publicar a interface
        shell: pwsh
        run: dotnet publish interface/ReceptorIphone -c Release -o dist/pacote
      # Identidade de teste: aqui so' se confere que o pacote MSIX monta.
      - name: Montar o MSIX (identidade de teste)
        shell: pwsh
        run: ./scripts/montar-msix.ps1 -Identidade "ConexaoTech.TesteDoCI" -Publicador "CN=00000000-0000-0000-0000-000000000000" -NomePublicador "Teste do CI" -Versao 0.0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: uxplay
          path: uxplay/build/uxplay.exe

  interface:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Testes da interface
        run: dotnet test interface
