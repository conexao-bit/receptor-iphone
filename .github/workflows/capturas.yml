name: capturas

# Capturas da janela para a pagina da Microsoft Store: sob demanda e nos PRs que
# mexem na captura. Com o uxplay de verdade, a janela fica em "Esperando o
# iPhone", como a pessoa ve'.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/capturar-janela.ps1
      - .github/workflows/capturas.yml

jobs:
  capturas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Compilar o uxplay e montar o pacote
        shell: msys2 {0}
        run: |
          ./scripts/compilar-uxplay.sh
          ./scripts/montar-pacote.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publicar a interface
        shell: pwsh
        run: dotnet publish interface/ReceptorIphone -c Release -o dist/pacote
      - name: Capturar
        shell: pwsh
        run: ./scripts/capturar-janela.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: dist/capturas
